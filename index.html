<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業級 AI 中國象棋 - 大師版 (修復版)</title>
    
    <!-- PWA & iOS Special Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="AI 中國象棋">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --board-bg: #eecb9d;
            --line-color: #4a3728;
            --river-color: #dfc2a4;
            --red-piece: #d32f2f;
            --black-piece: #212121;
            --highlight-move: rgba(0, 255, 0, 0.5);
            --highlight-last: rgba(255, 255, 0, 0.4);
            --check-color: rgba(255, 0, 0, 0.6);
        }

        * { 
            box-sizing: border-box; 
            font-family: "Kaiti", "楷體", "STKaiti", serif; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }

        body { 
            margin: 0; background-color: #d7ccc8; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 10px;
            overflow-x: hidden;
        }

        .app-container {
            display: flex; gap: 20px; max-width: 1100px; width: 100%;
            flex-direction: row;
            align-items: flex-start;
        }

        @media (max-width: 850px) {
            .app-container { flex-direction: column; align-items: center; }
            .game-area { width: 100%; max-width: 100%; }
            .history-panel { 
                width: 100% !important; 
                max-width: 100%; 
                height: 180px; 
                order: 3; 
            }
            .control-panel { 
                flex-wrap: wrap; justify-content: center; padding: 8px 15px; font-size: 0.85rem;
            }
            .history-header {
                padding: 5px 15px; background: #f8f8f8;
                justify-content: space-between;
            }
        }

        .game-area {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            max-width: 550px; width: 100%;
        }

        .game-title { color: #5d4037; margin: 5px 0 10px 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); font-size: 1.5rem; }

        .control-panel {
            display: flex; gap: 10px; align-items: center; margin-bottom: 15px;
            background: white; padding: 10px 20px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #status-msg { font-weight: bold; color: #5d4037; min-width: 100px; text-align: center; font-size: 0.9rem; }
        #turn-display { font-size: 0.85rem; padding: 4px 12px; border-radius: 15px; background: #f5f5f5; }

        #difficulty-select {
            padding: 6px 12px; border-radius: 15px; border: 1px solid #d7ccc8;
            background-color: #f5f5f5; color: #5d4037; cursor: pointer; outline: none; font-size: 0.85rem;
        }

        .board-container {
            position: relative; width: 100%; aspect-ratio: 9 / 10;
            background-color: var(--board-bg); border: 6px solid #5d4037;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
        }

        #board-lines {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; pointer-events: none; z-index: 1;
        }

        #river {
            position: absolute; width: 100%; height: 10%; top: 45%;
            background: var(--river-color); display: flex;
            justify-content: space-around; align-items: center;
            border-top: 2px solid var(--line-color); border-bottom: 2px solid var(--line-color);
            z-index: 2;
        }
        .river-text { font-size: 1.2rem; font-weight: bold; color: #5d4037; opacity: 0.7; }

        #pieces-layer {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 12;
            pointer-events: none; 
        }
        #highlights-layer {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10;
            pointer-events: none;
        }

        .piece {
            position: absolute; width: 9.09%; height: 9.09%;
            transform: translate(-50%, -50%); display: flex;
            justify-content: center; align-items: center;
            font-size: clamp(1.2rem, 6vw, 2.5rem); font-weight: bold;
            z-index: 10; transition: transform 0.1s ease;
            box-shadow: 0 4px 4px rgba(0,0,0,0.3); border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #e0e0e0);
            border: 2px solid #333;
        }
        .piece.red { color: var(--red-piece); border-color: var(--red-piece); }
        .piece.black { color: var(--black-piece); border-color: var(--black-piece); }
        .piece.selected { 
            transform: translate(-50%, -50%) scale(1.15); 
            z-index: 20; border: 3px solid gold;
        }
        .is-in-check { animation: check-pulse 0.8s infinite; }

        @keyframes check-pulse {
            0% { box-shadow: 0 0 0px var(--check-color); }
            50% { box-shadow: 0 0 15px var(--check-color); }
            100% { box-shadow: 0 0 0px var(--check-color); }
        }

        .highlight {
            position: absolute; width: 12%; height: 12%;
            transform: translate(-50%, -50%); border-radius: 50%;
            z-index: 5; pointer-events: none;
        }
        .highlight.move { background: var(--highlight-move); }
        .highlight.last-move { background: var(--highlight-last); border: 2px dashed white; }

        .history-panel {
            width: 280px; background: white; border-radius: 12px;
            display: flex; flex-direction: column; box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
        }
        .history-header {
            padding: 12px 15px; border-bottom: 1px solid #eee;
            display: flex; justify-between; align-items: center;
        }
        .history-list {
            flex: 1; padding: 10px; overflow-y: auto; 
            max-height: 400px;
            font-size: 0.9rem; line-height: 1.8;
        }
        .history-item { padding: 4px 8px; border-bottom: 1px solid #f9f9f9; }

        button {
            padding: 6px 15px; cursor: pointer; border: none; border-radius: 4px;
            background: #8d6e63; color: white; font-family: inherit; transition: 0.3s;
            font-size: 0.9rem;
        }
        button:hover { background: #6d4c41; }
        button:active { transform: scale(0.95); }
        .btn-group { display: flex; gap: 5px; }

        #mobile-history-toggle {
            display: none; width: 100%; padding: 8px; background: #5d4037;
            color: white; border: none; text-align: center;
        }
        @media (max-width: 850px) {
            #mobile-history-toggle { display: block; }
            .history-list { max-height: 120px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="game-area">
        <h1 class="game-title">專業級 AI 中國象棋</h1>
        
        <div class="control-panel">
            <select id="difficulty-select" onchange="changeDifficulty(this.value)">
                <option value="easy">新手 (Easy)</option>
                <option value="medium" selected>普通 (Medium)</option>

            </select>
            <div id="turn-display">輪到：紅方</div>
            <div id="status-msg">遊戲進行中</div>

        </div>

        <div id="game-container" class="board-container">

                <line x1="0" y1="0" x2="900" y2="0" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="111.1" x2="900" y2="111.1" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="222.2" x2="900" y2="222.2" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="333.3" x2="900" y2="333.3" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="444.4" x2="900" y2="444.4" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="555.6" x2="900" y2="555.6" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="666.7" x2="900" y2="666.7" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="777.8" x2="900" y2="777.8" stroke="#4a3728" stroke-width="2"/>
                <line x1="0" y1="888.9" x2="900" y2="888.9" stroke="#4a3728" stroke-width="2"/>
                <line x1="112.5" y1="0" x2="112.5" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="225" y1="0" x2="225" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="337.5" y1="0" x2="337.5" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="450" y1="0" x2="450" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="562.5" y1="0" x2="562.5" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="675" y1="0" x2="675" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="787.5" y1="0" x2="787.5" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="900" y1="0" x2="900" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="337.5" y1="0" x2="562.5" y2="222.2" stroke="#4a3728" stroke-width="2"/>
                <line x1="562.5" y1="0" x2="337.5" y2="222.2" stroke="#4a3728" stroke-width="2"/>
                <line x1="337.5" y1="777.8" x2="562.5" y2="1000" stroke="#4a3728" stroke-width="2"/>
                <line x1="562.5" y1="777.8" x2="337.5" y2="1000" stroke="#4a3728" stroke-width="2"/>
            </svg>
            <div id="river">
                <span class="river-text">楚 河</span>
                <span class="river-text">漢 界</span>
            </div>
            <div id="pieces-layer"></div>
            <div id="highlights-layer"></div>
        </div>
        <button id="mobile-history-toggle" onclick="toggleHistory()">顯示歷史紀錄</button>
    </div>

    <aside class="history-panel">
        <div class="history-header">
            <strong>歷史紀錄</strong>
            <span id="step-count" style="font-size: 0.8rem; color: #888;">步數: 0</span>
        </div>
        <div id="move-history" class="history-list"></div>
    </aside>
</div>

<script>
/* --- CONFIG & CONSTANTS --- */
const WEIGHTS = { K: 10000, R: 800, H: 400, E: 200, A: 200, C: 450, P: 100 };
const PIECES_MAP = {
    rK:'帥', rA:'仕', rE:'相', rH:'馬', rR:'車', rC:'砲', rP:'兵',
    bK:'將', bA:'士', bE:'象', bH:'馬', bR:'車', bC:'砲', bP:'卒'
};

const DIFFICULTY_SETTINGS = {
    easy:   { depth: 2, randomChance: 0.2 },
    medium: { depth: 3, randomChance: 0 },
    hard:   { depth: 4, randomChance: 0 },
    master: { depth: 4, randomChance: 0 } 
};

/* --- STATE VARIABLES --- */
let board = [];
let turn = 'r'; 
let gameActive = true;
let selectedCell = null;
let lastMove = null;
let moveHistory = [];
let redoStack = [];
let noCaptureCounter = 0;
let boardStateHistory = [];
let stepCount = 0;
let difficulty = 'medium';

let kingPositions = { r: { r: 9, c: 4 }, b: { r: 0, c: 4 } };
const STORAGE_KEY = 'ai_chess_save_v4';

/* --- CORE LOGIC --- */

function initBoard() {
    board = [
        ['bR', 'bH', 'bE', 'bA', 'bK', 'bA', 'bE', 'bH', 'bR'],
        ['', '', '', '', '', '', '', '', ''],
        ['', 'bC', '', '', '', '', '', 'bC', ''],
        ['bP', '', 'bP', '', 'bP', '', 'bP', '', 'bP'],
        ['', '', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', '', ''],
        ['rP', '', 'rP', '', 'rP', '', 'rP', '', 'rP'],
        ['', 'rC', '', '', '', '', '', 'rC', ''],
        ['', '', '', '', '', '', '', '', ''],
        ['rR', 'rH', 'rE', 'rA', 'rK', 'rA', 'rE', 'rH', 'rR']
    ];
    kingPositions = { r: { r: 9, c: 4 }, b: { r: 0, c: 4 } };
}

function initKingPositions() {
    const rKing = findKing(board, 'r');
    const bKing = findKing(board, 'b');
    if (rKing) kingPositions.r = rKing;
    if (bKing) kingPositions.b = bKing;
}

function canPieceMove(fr, fc, tr, tc, curBoard) {
    const piece = curBoard[fr][fc];
    if (!piece) return false;
    const color = piece[0];
    const type = piece[1];
    const dr = Math.abs(tr - fr);
    const dc = Math.abs(tc - fc);

    if (curBoard[tr][tc] && curBoard[tr][tc][0] === color) return false;

    switch (type) {
        case 'K':
            if (dr + dc !== 1) return false;
            if (fc < 3 || fc > 5 || tc < 3 || tc > 5) return false;
            if (color === 'r') { if (fr < 7 || fr > 9 || tr < 7 || tr > 9) return false; }
            else { if (fr < 0 || fr > 2 || tr < 0 || tr > 2) return false; }
            return true;
        case 'A':
            if (dr !== 1 || dc !== 1) return false;
            if (fc < 3 || fc > 5 || tc < 3 || tc > 5) return false;
            if (color === 'r') { if (fr < 7 || fr > 9 || tr < 7 || tr > 9) return false; }
            else { if (fr < 0 || fr > 2 || tr < 0 || tr > 2) return false; }
            return true;
        case 'E':
            if (dr !== 2 || dc !== 2) return false;
            if (color === 'b' && tr > 4) return false;
            if (color === 'r' && tr < 5) return false;
            if (curBoard[fr + (tr - fr)/2][fc + (tc - fc)/2]) return false;
            return true;
        case 'H':
            if (!((dr === 2 && dc === 1) || (dr === 1 && dc === 2))) return false;
            const mr = fr + (tr - fr)/2, mc = fc + (tc - fc)/2;
            if (dr === 2 && curBoard[mr][fc]) return false;
            if (dc === 2 && curBoard[fr][mc]) return false;
            return true;
        case 'R':
            if (fr !== tr && fc !== tc) return false;
            if (!isPathClear(fr, fc, tr, tc, curBoard)) return false;
            return true;
        case 'C':
            if (fr !== tr && fc !== tc) return false;
            const pathCount = getPathPieces(fr, fc, tr, tc, curBoard);
            return curBoard[tr][tc] ? pathCount === 1 : pathCount === 0;
        case 'P':
            if (color === 'r') {
                if (tr === fr - 1 && fc === tc) return true;
                if (fr <= 4 && dr === 0 && dc === 1) return true;
            } else {
                if (tr === fr + 1 && fc === tc) return true;
                if (fr >= 5 && dr === 0 && dc === 1) return true;
            }
            return false;
    }
    return true;
}

function isPathClear(fr, fc, tr, tc, curBoard) {
    let r = fr, c = fc;
    const dr = tr > fr ? 1 : (tr < fr ? -1 : 0);
    const dc = tc > fc ? 1 : (tc < fc ? -1 : 0);
    while (r !== tr || c !== tc) {
        r += dr; c += dc;
        if (r === tr && c === tc) break;
        if (curBoard[r][c]) return false;
    }
    return true;
}

function getPathPieces(fr, fc, tr, tc, curBoard) {
    let count = 0;
    let r = fr, c = fc;
    const dr = tr > fr ? 1 : (tr < fr ? -1 : 0);
    const dc = tc > fc ? 1 : (tc < fc ? -1 : 0);
    while (r !== tr || c !== tc) {
        r += dr; c += dc;
        if (r === tr && c === tc) break;
        if (curBoard[r][c]) count++;
    }
    return count;
}

function findKing(curBoard, color) {
    const target = color === 'r' ? 'rK' : 'bK';
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            if (curBoard[r][c] === target) return { r, c };
        }
    }
    return null;
}

function isKingInCheck(curBoard, color) {
    const oppColor = color === 'r' ? 'b' : 'r';
    const kingPos = findKing(curBoard, color);
    if (!kingPos) return true;

    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            const p = curBoard[r][c];
            if (p && p[0] === oppColor) {
                if (canPieceMove(r, c, kingPos.r, kingPos.c, curBoard)) return true;
            }
        }
    }
    return false;
}

/* --- AI ENGINE --- */
function evaluateBoard(curBoard, mode) {
    let score = 0;
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            const p = curBoard[r][c];
            if (p) {
                const color = p[0];
                const type = p[1];
                let val = WEIGHTS[type];
                if (type === 'P' && (mode === 'medium' || mode === 'hard' || mode === 'master')) {
                    if (p === 'rP' && r <= 4) val += 35;
                    if (p === 'bP' && r >= 5) val += 35;
                }
                if (mode === 'master') {
                    if (type === 'R' || type === 'C') if (c >= 3 && c <= 5) val += 30;
                    if (type === 'H') if (c >= 3 && c <= 5) val += 25;
                    if (type === 'K') if (c < 3 || c > 5) val += 20;
                }
                score += (color === 'b' ? val : -val);
            }
        }
    }
    return score;
}

function getRawMoves(curBoard, color) {
    const moves = [];
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            const p = curBoard[r][c];
            if (p && p[0] === color) {
                for (let tr = 0; tr < 10; tr++) {
                    for (let tc = 0; tc < 9; tc++) {
                        if (canPieceMove(r, c, tr, tc, curBoard)) {
                            const target = curBoard[tr][tc];
                            let val = target ? WEIGHTS[target[1]] : 0;
                            moves.push({ fr: r, fc: c, tr, tc, captureValue: val, pieceMoving: p, captured: target });
                        }
                    }
                }
            }
        }
    }
    moves.sort((a, b) => b.captureValue - a.captureValue);
    return moves;
}

function makeMove(fr, fc, tr, tc, currentBoard) {
    const movingPiece = currentBoard[fr][fc];
    const capturedPiece = currentBoard[tr][tc];
    let oldKingPos = null;
    if (movingPiece && movingPiece[1] === 'K') {
        oldKingPos = { r: kingPositions[movingPiece[0]].r, c: kingPositions[movingPiece[0]].c };
        kingPositions[movingPiece[0]] = { r: tr, c: tc };
    }
    currentBoard[tr][tc] = movingPiece;
    currentBoard[fr][fc] = '';
    return { capturedPiece, oldKingPos, movingPiece };
}

function unmakeMove(fr, fc, tr, tc, capturedPiece, movingPiece, oldKingPos) {
    board[fr][fc] = movingPiece;
    board[tr][tc] = capturedPiece;
    if (oldKingPos) kingPositions[movingPiece[0]] = oldKingPos;
}

function minimaxCorrected(depth, alpha, beta, isMaximizing, mode) {
    if (depth === 0) return evaluateBoard(board, mode);
    const currentPlayer = isMaximizing ? 'b' : 'r';
    const moves = getRawMoves(board, currentPlayer);
    if (moves.length === 0) return isMaximizing ? -20000 : 20000;
    if (isMaximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
            const { capturedPiece, oldKingPos, movingPiece } = makeMove(m.fr, m.fc, m.tr, m.tc, board);
            if (!isKingInCheck(board, currentPlayer) || (capturedPiece && capturedPiece[1] === 'K')) {
                let evalScore = minimaxCorrected(depth - 1, alpha, beta, false, mode);
                unmakeMove(m.fr, m.fc, m.tr, m.tc, capturedPiece, movingPiece, oldKingPos);
                maxEval = Math.max(maxEval, evalScore);
                alpha = Math.max(alpha, evalScore);
            } else unmakeMove(m.fr, m.fc, m.tr, m.tc, capturedPiece, movingPiece, oldKingPos);
            if (beta <= alpha) break;
        }
        return maxEval;
    } else {
        let minEval = Infinity;
        for (const m of moves) {
            const { capturedPiece, oldKingPos, movingPiece } = makeMove(m.fr, m.fc, m.tr, m.tc, board);
            if (!isKingInCheck(board, currentPlayer) || (capturedPiece && capturedPiece[1] === 'K')) {
                let evalScore = minimaxCorrected(depth - 1, alpha, beta, true, mode);
                unmakeMove(m.fr, m.fc, m.tr, m.tc, capturedPiece, movingPiece, oldKingPos);
                minEval = Math.min(minEval, evalScore);
                beta = Math.min(beta, evalScore);
            } else unmakeMove(m.fr, m.fc, m.tr, m.tc, capturedPiece, movingPiece, oldKingPos);
            if (beta <= alpha) break;
        }
        return minEval;
    }
}

async function aiMove() {
    if (!gameActive) return;
    const config = DIFFICULTY_SETTINGS[difficulty];
    if (config.randomChance > 0 && Math.random() < config.randomChance) {
        const moves = getRawMoves(board, 'b');
        if (moves.length > 0) {
            const randomMove = moves[Math.floor(Math.random() * moves.length)];
            executeMove(randomMove.fr, randomMove.fc, randomMove.tr, randomMove.tc);
        }
        return;
    }
    const moves = getRawMoves(board, 'b');
    if (moves.length === 0) { endGame("紅方獲勝 (黑方困斃)！"); return; }
    let bestMoves = [];
    let bestScore = -Infinity;
    setTimeout(() => {
        for (const m of moves) {
            const { capturedPiece, oldKingPos, movingPiece } = makeMove(m.fr, m.fc, m.tr, m.tc, board);
            let score = minimaxCorrected(config.depth, -Infinity, Infinity, false, difficulty);
            unmakeMove(m.fr, m.fc, m.tr, m.tc, capturedPiece, movingPiece, oldKingPos);
            if (score > bestScore) { bestScore = score; bestMoves = [m]; }
            else if (score === bestScore) bestMoves.push(m);
        }
        if (bestMoves.length > 0) {
            const chosenMove = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            executeMove(chosenMove.fr, chosenMove.fc, chosenMove.tr, chosenMove.tc);
        }
    }, 50);
}

function getLegalMovesWithCheck(curBoard, color) {
    const moves = [];
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            const p = curBoard[r][c];
            if (p && p[0] === color) {
                for (let tr = 0; tr < 10; tr++) {
                    for (let tc = 0; tc < 9; tc++) {
                        if (canPieceMove(r, c, tr, tc, curBoard)) {
                            const targetPiece = curBoard[tr][tc];
                            curBoard[tr][tc] = p;
                            curBoard[r][c] = '';
                            if (!isKingInCheck(curBoard, color) || (targetPiece && targetPiece[1] === 'K')) {
                                let val = targetPiece ? WEIGHTS[targetPiece[1]] : 0;
                                moves.push({ fr: r, fc: c, tr, tc, captureValue: val, pieceMoving: p, captured: targetPiece });
                            }
                            curBoard[r][c] = p;
                            curBoard[tr][tc] = targetPiece;
                        }
                    }
                }
            }
        }
    }
    return moves;
}

function executeMove(fr, fc, tr, tc, isRedo = false) {
    const pieceMoving = board[fr][fc];
    if (!pieceMoving) return;
    const color = pieceMoving[0];
    const captured = board[tr][tc];
    const prevNoCapture = noCaptureCounter;
    const prevTurn = turn;
    const prevBoard = JSON.stringify(board);
    moveHistory.push({ fr, fc, tr, tc, captured, prevTurn, prevNoCapture, prevBoard, pieceMoving });
    if (!isRedo) redoStack = [];
    makeMove(fr, fc, tr, tc, board);
    stepCount++;
    if (captured && captured[1] === 'K') { endGame(color === 'r' ? "紅方獲勝！" : "黑方獲勝！"); return; }
    if (checkDraws()) return;
    turn = color === 'r' ? 'b' : 'r';
    const nextMoves = getLegalMovesWithCheck(board, turn);
    if (nextMoves.length === 0) {
        endGame(turn === 'r' ? "黑方獲勝 (紅方困斃)！" : "紅方獲勝 (黑方困斃)！");
        updateUI();
        return;
    }
    lastMove = { fr, fc, tr, tc };
    updateUI();
    if (turn === 'b' && !isRedo) setTimeout(aiMove, 600);
    saveGame();
}

function checkDraws() {
    if (noCaptureCounter >= 60) { endGame("和棋 (60回合無吃子)"); return true; }
    const currentHash = JSON.stringify(board) + turn;
    boardStateHistory.push(currentHash);
    if (boardStateHistory.filter(h => h === currentHash).length >= 3) {
        endGame("和棋 (重複局面)");
        return true;
    }
    return false;
}

function undoMove() {
    if (moveHistory.length === 0 || !gameActive) return;
    if (moveHistory.length >= 2 && turn === 'r') {
        const aiM = moveHistory.pop();
        redoStack.push(aiM);
        const playerM = moveHistory.pop();
        redoStack.push(playerM);
        board = JSON.parse(playerM.prevBoard);
        turn = playerM.prevTurn;
        noCaptureCounter = playerM.prevNoCapture;
        stepCount -= 2;
    } else {
        const m = moveHistory.pop();
        redoStack.push(m);
        board = JSON.parse(m.prevBoard);
        turn = m.prevTurn;
        noCaptureCounter = m.prevNoCapture;
        stepCount--;
    }
    initKingPositions(); 
    selectedCell = null;
    lastMove = moveHistory.length > 0 ? moveHistory[moveHistory.length - 1] : null;
    updateUI();
}

function redoMove() {
    if (redoStack.length === 0 || !gameActive) return;
    const m = redoStack.pop();
    executeMove(m.fr, m.fc, m.tr, m.tc, true);
}

function endGame(msg) {
    gameActive = false;
    document.getElementById('status-msg').innerText = msg;
    saveGame();
}

/* --- UI INTERACTION --- */
function changeDifficulty(newDiff) {
    difficulty = newDiff;
    saveGame();
    document.getElementById('status-msg').innerText = `難度已更換為 ${newDiff}`;
    setTimeout(() => { if (gameActive) document.getElementById('status-msg').innerText = "遊戲進行中"; }, 1000);
}

function toggleHistory() {
    const list = document.getElementById('move-history');
    const btn = document.getElementById('mobile-history-toggle');
    if (list.style.display === 'none' || list.style.display === '') {
        list.style.display = 'block';
        btn.innerText = '收合歷史紀錄';
    } else {
        list.style.display = 'none';
        btn.innerText = '顯示歷史紀錄';
    }
}

function updateUI() {
    renderBoard();
    updateTurnDisplay();
    updateHistoryPanel();
    document.getElementById('step-count').innerText = `步數: ${stepCount}`;
    saveGame();
}

function updateTurnDisplay() {
    document.getElementById('turn-display').innerText = turn === 'r' ? '輪到：紅方' : '輪到：黑方 (AI)';
    if (gameActive) {
        document.getElementById('status-msg').innerText = "遊戲進行中";
    }
}

function renderBoard() {
    const pLayer = document.getElementById('pieces-layer');
    const hLayer = document.getElementById('highlights-layer');
    pLayer.innerHTML = '';
    hLayer.innerHTML = '';

    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
            const pCode = board[r][c];
            if (pCode) {
                const div = document.createElement('div');
                div.className = `piece ${pCode[0] === 'r' ? 'red' : 'black'}`;
                if (selectedCell && selectedCell.r === r && selectedCell.c === c) div.classList.add('selected');
                if (pCode[1] === 'K' && isKingInCheck(board, pCode[0])) div.classList.add('is-in-check');
                div.innerText = PIECES_MAP[pCode];
                div.style.left = `${(c / 8) * 100}%`;
                div.style.top = `${(r / 9) * 100}%`;
                pLayer.appendChild(div);
            }
        }
    }

    if (lastMove) {
        const lm = document.createElement('div');
        lm.className = 'highlight last-move';
        lm.style.left = `${(lastMove.tc / 8) * 100}%`;
        lm.style.top = `${(lastMove.tr / 9) * 100}%`;
        hLayer.appendChild(lm);
    }

    if (selectedCell) {
        const moves = getLegalMovesWithCheck(board, board[selectedCell.r][selectedCell.c][0]).filter(m => m.fr === selectedCell.r && m.fc === selectedCell.c);
        moves.forEach(m => {
            const hm = document.createElement('div');
            hm.className = 'highlight move';
            hm.style.left = `${(m.tc / 8) * 100}%`;
            hm.style.top = `${(m.tr / 9) * 100}%`;
            hLayer.appendChild(hm);
        });
    }
}

function updateHistoryPanel() {
    const list = document.getElementById('move-history');
    list.innerHTML = '';
    moveHistory.forEach((m, idx) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerText = `${idx + 1}. ${generateNotation(m)}`;
        list.appendChild(item);
    });
}

function generateNotation(m) {
    const files = ['九', '八', '七', '六', '五', '四', '三', '二', '一'];
    const ranks = ['十', '九', '八', '七', '六', '五', '四', '三', '二', '一'];
    const pName = PIECES_MAP[m.pieceMoving];
    return `${pName} ${files[m.fc]} ${ranks[m.fr]} → ${files[m.tc]} ${ranks[m.tr]}`; 
}

function setupInteraction() {
    const container = document.getElementById('game-container');
    container.addEventListener('pointerdown', (e) => {
        if (!gameActive || turn === 'b') return;
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const c = Math.round((x / rect.width) * 8);
        const r = Math.round((y / rect.height) * 9);
        const safeC = Math.max(0, Math.min(8, c));
        const safeR = Math.max(0, Math.min(9, r));
        handleBoardClick(safeR, safeC);
    });
}

function handleBoardClick(r, c) {
    const piece = board[r][c];
    if (selectedCell) {
        const fr = selectedCell.r;
        const fc = selectedCell.c;
        const color = board[fr][fc][0];
        const m = getLegalMovesWithCheck(board, color).find(
            move => move.fr === fr && move.fc === fc && move.tr === r && move.tc === c
        );
        if (m) {
            executeMove(m.fr, m.fc, m.tr, m.tc);
            selectedCell = null;
        } else {
            if (piece && piece[0] === color) selectedCell = { r, c };
            else selectedCell = null;
        }
    } else {
        if (piece && piece[0] === 'r') selectedCell = { r, c };
        else selectedCell = null;
    }
    updateUI();
}

function resetGame() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    location.reload();
}

function saveGame() {
    try {
        const data = { board, turn, gameActive, stepCount, noCaptureCounter, moveHistory, redoStack, boardStateHistory, difficulty };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
}

function loadGame() {
    let data = null;
    try { data = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (data) {
        try {
            const parsed = JSON.parse(data);
            board = parsed.board;
            turn = parsed.turn;
            gameActive = parsed.gameActive;
            stepCount = parsed.stepCount;
            noCaptureCounter = parsed.noCaptureCounter;
            moveHistory = parsed.moveHistory;
            redoStack = parsed.redoStack;
            boardStateHistory = parsed.boardStateHistory;
            difficulty = parsed.difficulty;
            document.getElementById('difficulty-select').value = difficulty;
            initKingPositions();
        } catch (e) { initBoard(); }
    } else { initBoard(); }
    updateUI();
}

initBoard();
loadGame();
setupInteraction();

/* --- PWA: SERVICE WORKER REGISTRATION --- */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker 註冊成功!'))
            .catch(err => console.error('Service Worker 註冊失敗:', err));
    });
}
